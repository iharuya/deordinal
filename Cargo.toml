[package]
name = "deordinal"
version = "0.1.0"
edition = "2024"
description = "Detect unnecessary ordering labels in Markdown and code comments"

[dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
jsonc-parser = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
pulldown-cmark = "0.13"
regex = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
