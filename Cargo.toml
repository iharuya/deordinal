[package]
name = "deordinal"
version = "0.2.0"
edition = "2024"
description = "Detect and remove unnecessary ordering labels in documentation and comments."
license = "MIT"
repository = "https://github.com/iharuya/deordinal"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
jsonc-parser = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
pulldown-cmark = "0.13"
regex = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tempfile = "3"

[dev-dependencies]
serde_json = "1"
