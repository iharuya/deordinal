[package]
name = "deordinal"
version = "0.1.0"
edition = "2024"
description = "Detect unnecessary ordering labels in Markdown and code comments"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
pulldown-cmark = "0.13"
regex = "1"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"

[dev-dependencies]
tempfile = "3"
