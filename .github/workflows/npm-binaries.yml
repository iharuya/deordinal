name: npm binaries

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin-arm64
            binary: deordinal
          - runner: macos-26-intel
            platform: darwin-x64
            binary: deordinal
          - runner: ubuntu-26.04
            platform: linux-x64
            binary: deordinal
          - runner: windows-2025
            platform: win32-x64
            binary: deordinal.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: cargo build --release --locked
      - run: node npm/scripts/check-binary.cjs target/release/${{ matrix.binary }}
      - uses: actions/upload-artifact@v6
        with:
          name: deordinal-${{ matrix.platform }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7
