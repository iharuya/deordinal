name: npm binaries

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin-arm64
            binary: deordinal
          - runner: macos-26-intel
            platform: darwin-x64
            binary: deordinal
          - runner: ubuntu-26.04
            platform: linux-x64
            binary: deordinal
          - runner: windows-2025
            platform: win32-x64
            binary: deordinal.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deordinal-${{ matrix.platform }}
          path: target/release/${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

  pack:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.manifest.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 12.3.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: deordinal-*
          path: release-artifacts
      - run: node npm/scripts/stage-binaries.cjs
      - id: manifest
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(node -p "require('./npm/package.json').version")
          if [[ -n "$EXPECTED_VERSION" && "$EXPECTED_VERSION" != "$version" ]]; then
            echo "Input version does not match npm/package.json" >&2
            exit 1
          fi
          node npm/scripts/check-release-version.cjs "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: cargo publish --dry-run --locked
      - run: pnpm --dir npm pack
      - shell: bash
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          node npm/scripts/verify-tarball.cjs "npm/deordinal-$VERSION.tgz"
          (cd npm && sha256sum "deordinal-$VERSION.tgz" > "deordinal-$VERSION.tgz.sha256")
          echo "Built from $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: npm-package
          path: |
            npm/*.tgz
            npm/*.tgz.sha256
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            platform: darwin-arm64
          - runner: macos-26-intel
            platform: darwin-x64
          - runner: ubuntu-26.04
            platform: linux-x64
          - runner: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 12.3.4
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package
          path: npm-package
      - shell: bash
        env:
          VERSION: ${{ needs.pack.outputs.version }}
        run: |
          mkdir smoke
          cd smoke
          printf '{"private":true}\n' > package.json
          pnpm add -D "../npm-package/deordinal-$VERSION.tgz"
          pnpm exec deordinal --version | grep -Fx "deordinal $VERSION"
          printf '# Plain heading\n' > clean.md
          pnpm exec deordinal check clean.md
          printf '# Step 1\n' > warning.md
          status=0
          pnpm exec deordinal check warning.md > diagnostic.txt 2>&1 || status=$?
          test "$status" -eq 1
          grep -q 'keyword-prefix' diagnostic.txt
          echo "Installed tarball passed on ${{ matrix.platform }}" >> "$GITHUB_STEP_SUMMARY"
